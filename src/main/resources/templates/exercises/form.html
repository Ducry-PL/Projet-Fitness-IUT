<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Modifier Exercice' : 'Ajouter un Exercice'} + ' - Fitness IUT'">Exercise Form - Fitness IUT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="container">
            <h1>Fitness IUT</h1>
            <nav>
                <a th:href="@{/routines(page=${page}, size=${size}, mc=${mc})}">Routines</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2 th:text="${isEdit ? 'Modifier Exercice' : 'Ajouter un Exercice'}">Exercise Form</h2>
            <a th:href="@{/routines/{id}(id=${routine.id}, page=${page}, size=${size}, mc=${mc})}" 
               class="btn btn-secondary">Annuler</a>
        </div>

        <div class="detail-card">
            <h3>Routine: <span th:text="${routine.name}">Routine Name</span></h3>
        </div>

        <div class="form-container">
            <form th:action="${isEdit ? '/routines/' + routine.id + '/exercises/' + exercise.id + '/edit' : '/routines/' + routine.id + '/exercises/create'}" 
                  th:object="${exercise}" 
                  method="post" 
                  class="form">
                
                <input type="hidden" name="page" th:value="${page}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="mc" th:value="${mc}">

                <div class="form-group">
                    <label for="name">Nom de l'exercice <span class="required">*</span></label>
                    <input type="text" 
                           id="name" 
                           th:field="*{name}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"
                           placeholder="Ex: Pompes"
                           required>
                    <span th:if="${#fields.hasErrors('name')}" 
                          th:errors="*{name}" 
                          class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="repetitions">Nombre de répétitions <span class="required">*</span></label>
                    <input type="number" 
                           id="repetitions" 
                           th:field="*{repetitions}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('repetitions')} ? 'error' : ''"
                           min="1"
                           placeholder="Ex: 15"
                           required>
                    <span th:if="${#fields.hasErrors('repetitions')}" 
                          th:errors="*{repetitions}" 
                          class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="weight">Poids (kg) <span class="required">*</span></label>
                    <input type="number" 
                           id="weight" 
                           th:field="*{weight}" 
                           class="form-control"
                           th:classappend="${#fields.hasErrors('weight')} ? 'error' : ''"
                           min="0"
                           step="0.5"
                           placeholder="Ex: 20.0"
                           required>
                    <span th:if="${#fields.hasErrors('weight')}" 
                          th:errors="*{weight}" 
                          class="error-message"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Modifier' : 'Ajouter'}">Submit</button>
                    <a th:href="@{/routines/{id}(id=${routine.id}, page=${page}, size=${size}, mc=${mc})}" 
                       class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Fitness IUT - Projet Spring Boot</p>
        </div>
    </footer>
</body>
</html>
