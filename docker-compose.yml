version: '3.8'

services:
  mariadb:
    image: mariadb:11.2
    container_name: fitness-iut-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: fitness_iut
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - fitness-network

volumes:
  mariadb_data:

networks:
  fitness-network:
    driver: bridge
